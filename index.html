<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EMI Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>EMI Calculator</h1>

    <div class="input-group">
      <label>Loan Amount (₹)</label>
      <input type="number" id="loanAmount" placeholder="e.g. 500000" />
    </div>

    <div class="input-group">
      <label>Interest Rate (% per annum)</label>
      <input type="number" id="interestRate" placeholder="e.g. 8.5" />
    </div>

    <div class="input-group">
      <label>Loan Tenure (Years)</label>
      <input type="number" id="loanTenure" placeholder="e.g. 20" />
    </div>

    <button onclick="calculateEMI()">Calculate EMI</button>

    <div class="result">
      <p>Monthly EMI: <span id="emi">—</span></p>
      <p>Total Interest: <span id="totalInterest">—</span></p>
      <p>Total Payable: <span id="totalPayment">—</span></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
